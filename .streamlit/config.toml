[theme]
base = "light"
primaryColor = "#1f5fbf"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#eaf0f8"
textColor = "#0b1b33"
borderColor = "#e3e9f2"
baseRadius = "0.75rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Jost:https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#011e3c"
secondaryBackgroundColor = "#0b3c70"
textColor = "#e8eef7"
primaryColor = "#86b6ef"
borderColor = "#1b4a7a"

[server]
runOnSave = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
